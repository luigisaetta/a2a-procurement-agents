[pytest]
# Test folders are not Python packages (no __init__.py): every service has
# files with the same names, such as test_pipeline.py, and importlib mode
# then gives each file a module name derived from its path.
addopts = --import-mode=importlib -m "not e2e"
# Collect only test folders, not the example clients named test_client.py.
testpaths =
    tests
    services/*/tests
markers =
    e2e: Docker Compose end-to-end tests that require the local demo stack.
